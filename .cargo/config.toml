# Android 交叉编译工具链接线（本机 NDK：/home/emo/android-sdk/ndk/28.2.13676358）。
#
# 目的：不经 cargo-ndk 的纯 cargo 命令（如 cargo check --target aarch64-linux-android）
# 也能完成编译——ring 等 C 依赖的 build script 走 cc crate，cc 按 CC_<triple> /
# TARGET_CC / PATH 找编译器，纯 cargo 环境下三者皆空，报
# "failed to find tool aarch64-linux-android-clang"。
#
# API level 24 与 CI 的 cargo-ndk --platform 24（.github/workflows/ci.yml）一致。
# 走 cargo-ndk 的构建不受影响（cargo-ndk 自行设置 linker 并优先用 shell 里的
# ANDROID_NDK_HOME；本文件不设置该变量，避免覆盖用户环境）。

[target.aarch64-linux-android]
linker = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

[target.armv7-linux-androideabi]
linker = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"

[target.x86_64-linux-android]
linker = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"

[env]
# cc crate 的 NDK 自动探测入口（CC_* 缺省时的兜底路径）。
ANDROID_NDK_ROOT = "/home/emo/android-sdk/ndk/28.2.13676358"

# cc crate 依次尝试 CC_<triple-连字符> 与 CC_<triple-下划线>，两种形式都给。
CC_aarch64-linux-android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
CC_aarch64_linux_android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
AR_aarch64-linux-android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
AR_aarch64_linux_android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

# NDK 的 armv7 triple 是 armv7a-linux-androideabi（与 rust 的 armv7-linux-androideabi 不同）。
CC_armv7-linux-androideabi = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
CC_armv7_linux_androideabi = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
AR_armv7-linux-androideabi = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
AR_armv7_linux_androideabi = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

CC_x86_64-linux-android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
CC_x86_64_linux_android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
AR_x86_64-linux-android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
AR_x86_64_linux_android = "/home/emo/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
