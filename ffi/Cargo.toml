[package]
name = "voicefox-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
flutter_rust_bridge = "=2.13.0"
libc = "0.2"
serde.workspace = true
voicefox-application = { package = "voicefox-application", path = "../application" }
# default-features = false：移动端 ABI 不带 mpv；桌面由 desktop-mpv feature 显式开回
voicefox-runtime = { path = "../runtime", default-features = false }
lx-core = { path = "../core" }

[features]
default = ["desktop-mpv", "js-sources"]
desktop-mpv = ["voicefox-runtime/desktop-mpv"]
js-sources = ["voicefox-runtime/js-sources"]
