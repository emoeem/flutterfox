name: voicefox_flutter
description: Voicefox Flutter frontend
publish_to: none
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  cached_network_image: ">=3.3.0 <4.0.0"
  # --- myune_music UI 基底所需（vendored lib/src/myune/，Apache-2.0） ---
  colorgram: ^2.0.0
  crypto: ^3.0.6
  file_picker: ^10.2.0
  hotkey_manager: ^0.2.3
  http: ^1.4.0
  markdown_widget: ^2.3.2+8
  mesh_gradient: ^1.3.8
  path: ^1.9.1
  path_provider: ^2.1.5
  pinyin: ^3.3.0
  pointycastle: ^4.0.0
  provider: ^6.1.5
  rxdart: ^0.28.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  silky_scroll: ^2.6.4
  system_fonts: ^1.0.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  window_manager: ^0.6.0
  # --- voicefox 原有 ---
  dynamic_color: 1.7.0
  flex_color_scheme: ">=8.0.0 <9.0.0"
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^3.1.0
  material_color_utilities: ^0.13.0
  qr_flutter: ^4.1.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

dependency_overrides:
  # 本地无原生实现的插件 → 纯 Dart stub（全局热键/系统字体枚举是 P1，不引入系统库）
  hotkey_manager:
    path: packages/hotkey_manager
  system_fonts:
    path: packages/system_fonts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.0
  build_runner: ^2.10.0
  fake_async: ^1.3.3

flutter:
  # 缺了它 MaterialIcons 字体不打包，图标会退化为系统 CJK 字体渲染成汉字
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
