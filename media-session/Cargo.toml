[package]
name = "media-session"
version = "0.9.0"
edition.workspace = true
publish = false

[dependencies]
lx-core = { path = "../core" }
tokio.workspace = true
tracing.workspace = true
# mpris.rs(linux)与 smtc.rs(windows)的 `anyhow::Result`/错误构造共用;
# 缺声明时对应平台的 workspace clippy/build 直接 E0433(未编译平台不可见)。
anyhow.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

# smtc.rs:SMTC 依附的隐藏顶层窗口与消息泵(WNDCLASSW 定义门控在
# Win32_Graphics_Gdi 特性下,与 TUI app crate 同款特性集)。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }
